name: Build & Push Containers

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io

jobs:
  build:
    name: ${{ matrix.image }}
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - image: serial-fork-bot
            dockerfile: Dockerfile.bot
          - image: serial-fork-web
            dockerfile: Dockerfile.web

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # GHCR requires lowercase owner names
      - name: Compute image name
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image }}"
          echo "IMAGE=${IMAGE,,}" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Read version from pyproject.toml
        id: version
        run: |
          VERSION=$(grep '^version' pyproject.toml | sed 's/version = "\(.*\)"/\1/')
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      # Generates tags + OCI labels from git context:
      #   push to main  → :0.2.0, :latest
      #   push v1.2.3   → :1.2.3, :1.2, :latest
      #   pull request  → :pr-42  (build only, not pushed)
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=${{ steps.version.outputs.version }},enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=ref,event=pr

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64,linux/arm64
          # Pull the latest image from the registry to use as a cache source.
          # Falls back gracefully if no image exists yet (first build).
          cache-from: type=registry,ref=${{ env.IMAGE }}:latest
          cache-to: type=inline

      # GITHUB_TOKEN cannot change package visibility — a PAT is required.
      # Create a classic PAT with write:packages scope at https://github.com/settings/tokens
      # and store it as a repository secret named PACKAGES_TOKEN.
      # This step is skipped if the secret is not set.
      - name: Make package public
        if: github.event_name != 'pull_request' && secrets.PACKAGES_TOKEN != ''
        uses: actions/github-script@v7
        env:
          PACKAGES_TOKEN: ${{ secrets.PACKAGES_TOKEN }}
        with:
          github-token: ${{ secrets.PACKAGES_TOKEN }}
          script: |
            if (!process.env.PACKAGES_TOKEN) {
              core.notice('PACKAGES_TOKEN secret not set — skipping visibility change');
              return;
            }
            const owner = context.repo.owner;
            const packageName = '${{ matrix.image }}';
            const { data: ownerData } = await github.rest.users.getByUsername({ username: owner });
            if (ownerData.type === 'Organization') {
              await github.request('PATCH /orgs/{org}/packages/container/{package_name}', {
                org: owner,
                package_name: packageName,
                visibility: 'public',
              });
            } else {
              await github.request('PATCH /user/packages/container/{package_name}', {
                package_name: packageName,
                visibility: 'public',
              });
            }
