name: Build & Push Containers

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io

jobs:
  build:
    name: ${{ matrix.image }}
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - image: bb-serial-bot
            dockerfile: Dockerfile.bot
          - image: bb-serial-web
            dockerfile: Dockerfile.web

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # GHCR requires lowercase owner names
      - name: Compute image name
        run: |
          echo "IMAGE=${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image }}" \
            | tr '[:upper:]' '[:lower:]' >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Generates tags + OCI labels from git context:
      #   push to main  → :latest
      #   push v1.2.3   → :1.2.3, :1.2, :latest
      #   pull request  → :pr-42  (build only, not pushed)
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=ref,event=pr

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64,linux/arm64
          # Pull the latest image from the registry to use as a cache source.
          # Falls back gracefully if no image exists yet (first build).
          cache-from: type=registry,ref=${{ env.IMAGE }}:latest
          cache-to: type=inline
