version: "3.9"

services:
  bot:
    build:
      context: .
      dockerfile: Dockerfile.bot
    restart: unless-stopped
    env_file: .env
    environment:
      - CONFIG_PATH=/app/config.toml
    volumes:
      - db_data:/data
      - ./config.toml:/app/config.toml:ro
    depends_on: []

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    restart: unless-stopped
    env_file: .env
    environment:
      - CONFIG_PATH=/app/config.toml
    ports:
      - "${WEB_PORT:-8000}:8000"
    volumes:
      - db_data:/data
      - ./config.toml:/app/config.toml:ro

volumes:
  db_data:
    driver: local
