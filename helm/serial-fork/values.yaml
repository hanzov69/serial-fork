# Serial Fork Helm Chart — default values
# Override any of these in your own values file or with --set flags.

# -- Container images
image:
  bot:
    repository: ghcr.io/hanzov69/serial-fork-bot
    tag: "latest"
    # Always pull when using the latest tag so nodes never run stale images.
    # Pin to a specific tag (e.g. "0.2.1") and switch to IfNotPresent in production.
    pullPolicy: Always
  web:
    repository: ghcr.io/hanzov69/serial-fork-web
    tag: "latest"
    pullPolicy: Always

# -- Image pull secrets (for private registries)
imagePullSecrets: []

# ── Discord ─────────────────────────────────────────────────────────
# Non-secret Discord settings (IDs, not tokens)
discord:
  # The Guild (server) ID where the bot operates
  guildId: ""
  # Forum channel where users create build posts and use /request
  forumChannelId: ""
  # Channel where mods receive approval notifications
  modNotifyChannelId: ""
  # Discord application client ID (OAuth2)
  clientId: ""

# ── Web app (public-facing) ───────────────────────────────────────────
web:
  # Public base URL used for OAuth2 redirect URIs and outbound links.
  # This value is used DIRECTLY — no port is ever injected automatically.
  # - Behind an ingress / reverse proxy: no port
  #     e.g. https://serials.yourdomain.com
  # - Direct access (local dev): include the port explicitly
  #     e.g. http://localhost:8000
  # No trailing slash. Must exactly match a redirect URI registered in
  # the Discord Developer Portal → OAuth2 → Redirects (append /auth/callback).
  baseUrl: ""  # REQUIRED — set to your public URL, e.g. https://serials.yourdomain.com

# ── Server (internal) ────────────────────────────────────────────────
# These settings control where uvicorn binds INSIDE the container.
# They have NO effect on the OAuth callback URL or any public URL —
# that is controlled entirely by web.baseUrl above.
server:
  # Port uvicorn listens on inside the pod. The Service and Ingress handle
  # the external port mapping (80/443 → this port). Change only if another
  # workload already occupies 8000 on the node.
  port: 8000
  host: "0.0.0.0"

# ── Secrets ──────────────────────────────────────────────────────────
# Option A: let the chart create a Secret from these values.
# Option B: create your own Secret and set existingSecret to its name;
#           the chart will reference it instead of creating one.
#           The existing secret must contain the keys:
#             DISCORD_TOKEN, DISCORD_CLIENT_SECRET, WEB_SECRET_KEY
secrets:
  # Set to the name of a pre-existing Secret to skip Secret creation.
  existingSecret: ""
  # Plaintext values — only used when existingSecret is empty.
  # Prefer passing these via --set or a separate secrets values file
  # that is NOT committed to version control.
  discordToken: ""
  discordClientSecret: ""
  webSecretKey: ""

# ── Bootstrap owner ───────────────────────────────────────────────────
# Idempotent: safe to leave set permanently after first deploy.
initialOwner:
  discordId: ""
  username: "Owner"

# ── App configuration ─────────────────────────────────────────────────
config:
  serialPadWidth: 3
  rejectedRequestPurgeDays: 30
  # Set to true only during initial deploy to sync Discord slash commands,
  # then back to false to avoid hitting Discord rate limits on every restart.
  syncCommands: false
  debug: false
  # Allow admin-role users to download a database backup.
  # Owner can always download regardless of this setting.
  backupAllowAdmin: false

# ── Persistence (SQLite database) ────────────────────────────────────
# The bot and web containers run in the same pod and share this volume.
# ReadWriteOnce is sufficient (single pod).
persistence:
  enabled: true
  # Leave empty to use the cluster's default StorageClass.
  storageClass: ""
  size: 1Gi
  accessMode: ReadWriteOnce
  # Override to use an existing PVC instead of creating one.
  existingClaim: ""

# ── Service ───────────────────────────────────────────────────────────
service:
  type: ClusterIP
  port: 80

# ── Ingress ───────────────────────────────────────────────────────────
ingress:
  enabled: false
  className: ""
  annotations: {}
    # cert-manager.io/cluster-issuer: letsencrypt-prod
    # nginx.ingress.kubernetes.io/proxy-body-size: "10m"
  host: "serials.yourdomain.com"
  tls:
    enabled: false
    secretName: "serial-fork-tls"

# ── Resources ─────────────────────────────────────────────────────────
resources:
  bot:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi
  web:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi

# ── Pod settings ──────────────────────────────────────────────────────
podAnnotations: {}

# fsGroup must match the GID of the non-root user in the Dockerfiles (appuser).
podSecurityContext:
  fsGroup: 999

nodeSelector: {}
tolerations: []
affinity: {}
