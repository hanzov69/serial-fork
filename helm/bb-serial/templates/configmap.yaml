apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "bb-serial.fullname" . }}
  labels:
    {{- include "bb-serial.labels" . | nindent 4 }}
data:
  # ── Discord (non-secret) ────────────────────────────────────────────
  DISCORD_GUILD_ID: {{ .Values.discord.guildId | quote }}
  DISCORD_FORUM_CHANNEL_ID: {{ .Values.discord.forumChannelId | quote }}
  DISCORD_MOD_NOTIFY_CHANNEL_ID: {{ .Values.discord.modNotifyChannelId | quote }}
  DISCORD_CLIENT_ID: {{ .Values.discord.clientId | quote }}

  # ── Web app (public URL — controls OAuth2 redirect URI) ─────────────
  WEB_BASE_URL: {{ required "web.baseUrl is required. Set it to your public URL (e.g. https://serials.yourdomain.com). It is used directly as the OAuth2 redirect URI base — do not include a trailing slash or a port unless your public URL genuinely requires one." .Values.web.baseUrl | quote }}
  # ── Server (internal bind — does NOT affect OAuth2 or any public URL) ─
  WEB_HOST: {{ .Values.server.host | quote }}
  WEB_PORT: {{ .Values.server.port | quote }}

  # ── Database ────────────────────────────────────────────────────────
  DB_PATH: "/data/bb_serial.db"

  # ── App behaviour ───────────────────────────────────────────────────
  SERIAL_PAD_WIDTH: {{ .Values.config.serialPadWidth | quote }}
  REJECTED_REQUEST_PURGE_DAYS: {{ .Values.config.rejectedRequestPurgeDays | quote }}
  BACKUP_ALLOW_ADMIN: {{ .Values.config.backupAllowAdmin | quote }}
  SYNC_COMMANDS: {{ .Values.config.syncCommands | quote }}
  DEBUG: {{ .Values.config.debug | quote }}

  # ── Bootstrap owner ─────────────────────────────────────────────────
  {{- if .Values.initialOwner.discordId }}
  INITIAL_OWNER_DISCORD_ID: {{ .Values.initialOwner.discordId | quote }}
  INITIAL_OWNER_USERNAME: {{ .Values.initialOwner.username | quote }}
  {{- end }}
